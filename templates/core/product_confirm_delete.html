{% extends 'base.html' %}
{% block title %}Delete Product - FitCart{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">Delete Product</h2>
    <p>Are you sure you want to delete "{{ product.name }}"?</p>
    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700">Confirm Delete</button>
        <a href="{% url 'dashboard' %}" class="ml-2 text-blue-600 hover:underline">Cancel</a>
    </form>
</div>
{% endblock %}
